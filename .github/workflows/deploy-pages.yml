name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/dcruz-guitars-website-en0mii]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to patch releases for reproducibility; ideally full commit SHAs.
      - uses: actions/checkout@v4.2.2
      - name: Validate before deploying
        run: |
          node --check script.js
          python3 - <<'EOF'
          import re, sys, os
          from html.parser import HTMLParser
          class P(HTMLParser):
              VOID = {'meta','link','br','img','input','hr','source','wbr','image'}
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.stack=[]; self.errs=[]
              def handle_starttag(self, tag, attrs):
                  if tag not in self.VOID: self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in self.VOID: return
                  if not self.stack or self.stack[-1] != tag:
                      self.errs.append(f"tag mismatch near </{tag}> at {self.getpos()}")
                  else: self.stack.pop()
          failed = False
          for page in ("index.html", "404.html"):
              html = open(page).read()
              p = P(); p.feed(html)
              if p.errs or p.stack:
                  print(page, "invalid:", p.errs or p.stack); failed = True
              # every local asset the page references must exist
              for attr, ref in re.findall(r'(src|href|srcset)="([^"#]+)"', html):
                  if ref.startswith(("http", "data:", "mailto:", "tel:")):
                      continue
                  parts = ref.split(",") if attr == "srcset" else [ref]
                  for part in parts:
                      path = part.strip().split(" ")[0].split("?")[0]
                      local = path.lstrip("/")
                      if local.startswith("dcruz/"):
                          local = local[len("dcruz/"):]
                      if not local:  # site root
                          continue
                      if not os.path.exists(local):
                          print(page, "missing asset:", path); failed = True
          # every url() referenced from the stylesheet (fonts, images) must exist too
          css = open("styles.css").read()
          for ref in re.findall(r'url\(["\']?([^"\')]+)["\']?\)', css):
              if ref.startswith(("http", "data:")):
                  continue
              path = ref.split("?")[0].split("#")[0]
              if not os.path.exists(path):
                  print("styles.css missing url():", path); failed = True
          sys.exit(1 if failed else 0)
          EOF
      - name: Assemble site directory
        run: |
          # Publish only the site itself — never repo internals (.claude, .github, README)
          mkdir dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='README.md' \
            --exclude='.lighthouserc.json' \
            --exclude='.lhci' \
            --exclude='rendered.html' \
            --exclude='dist' \
            ./ dist/
          # Stamp the sitemap with the deploy date
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>$(date -u +%F)</lastmod>|" dist/sitemap.xml
          # Cache-bust CSS/JS/manifest so returning visitors never mix old and new assets
          V="${GITHUB_SHA::8}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$V\"|" dist/index.html
          sed -i "s|src=\"script.js\"|src=\"script.js?v=$V\"|" dist/index.html
          sed -i "s|href=\"site.webmanifest\"|href=\"site.webmanifest?v=$V\"|" dist/index.html
          sed -i "s|icon-192.png\"|icon-192.png?v=$V\"|; s|icon-512.png\"|icon-512.png?v=$V\"|" dist/site.webmanifest
          sed -i "s|href=\"/dcruz/styles.css\"|href=\"/dcruz/styles.css?v=$V\"|" dist/404.html
          # A ?v on the stylesheet URL doesn't bust the url() targets inside it —
          # stamp the font files themselves so a font swap can't serve stale bytes.
          # Anchor on the filename suffix so we never touch the format("woff2") hint.
          sed -i "s|-var.woff2\")|-var.woff2?v=$V\")|g" dist/styles.css
      - name: Runtime smoke test
        run: |
          # Serve the built site and prove the JS boots end-to-end in a real browser:
          # the "(7)" filter counts only exist if every init module ran without throwing.
          python3 -m http.server 8080 --directory dist &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 \
            --dump-dom http://localhost:8080/ > rendered.html
          # The filter count is only injected once every init module runs without
          # throwing. Match any count so a change in inventory can't break deploys.
          grep -qE "All \([0-9]+\)" rendered.html || { echo "JS boot failed: filter counts missing"; exit 1; }
          grep -q "site-footer" rendered.html || { echo "page truncated: footer missing"; exit 1; }
          grep -q "card-zoom" rendered.html || { echo "lightbox init failed: zoom buttons missing"; exit 1; }
          # The custom 404 must also render (it has its own stylesheet link)
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 \
            --dump-dom http://localhost:8080/404.html > rendered-404.html
          grep -q "styles.css" rendered-404.html || { echo "404.html failed to render"; exit 1; }
      - name: Lighthouse assertions
        run: npx --yes @lhci/cli@0.13.0 autorun
      - uses: actions/configure-pages@v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4.0.5

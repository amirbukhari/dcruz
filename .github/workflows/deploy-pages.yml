name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/dcruz-guitars-website-en0mii]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site directory
        run: |
          # Publish only the site itself — never repo internals (.claude, .github, README)
          mkdir dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='README.md' \
            --exclude='dist' \
            ./ dist/
          # Stamp the sitemap with the deploy date
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>$(date -u +%F)</lastmod>|" dist/sitemap.xml
          # Cache-bust CSS/JS so returning visitors never mix old and new assets
          V="${GITHUB_SHA::8}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$V\"|" dist/index.html
          sed -i "s|src=\"script.js\"|src=\"script.js?v=$V\"|" dist/index.html
          sed -i "s|href=\"/dcruz/styles.css\"|href=\"/dcruz/styles.css?v=$V\"|" dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
